[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "animyst"
version = "0.2.0"
description = "ANIMYST — Describe what you want, walk away, come back to a working repo. Autonomous build rites."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Abhi", email = "abhi@famished.ai" },
]
keywords = ["tui", "agents", "autonomous", "claude-code", "ralph-loop", "cli", "rite", "animyst"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Terminals",
]
dependencies = [
    "textual>=1.0.0",
    "rich>=13.0.0",
]

[project.scripts]
animyst = "animyst.cli:main"

[project.urls]
Homepage = "https://animystlab.com"
Repository = "https://github.com/CreatorGodMode/animystcli"
Issues = "https://github.com/CreatorGodMode/animystcli/issues"

[tool.hatch.build.targets.wheel]
packages = ["animyst"]

[tool.hatch.build.targets.wheel.force-include]
"animyst/prompt_template.md" = "animyst/prompt_template.md"
"animyst/settings_template.json" = "animyst/settings_template.json"
"animyst/loop.sh" = "animyst/loop.sh"
